apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-remote
  namespace: claude-sandbox
  labels:
    app.kubernetes.io/name: claude-remote
    app.kubernetes.io/component: aggregator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-remote
        app.kubernetes.io/component: aggregator
    spec:
      serviceAccountName: claude-remote
      containers:
        - name: claude-remote
          image: claude-remote:latest  # replace with your registry
          args:
            - --config=/etc/claude-remote/config.yaml
            - --addr=:8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /etc/claude-remote
            - name: workspace
              mountPath: /workspace
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
                  optional: true
            - name: HOME
              value: /workspace
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: claude-remote-config
        - name: workspace
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: claude-remote
  namespace: claude-sandbox
spec:
  selector:
    app.kubernetes.io/name: claude-remote
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-remote-config
  namespace: claude-sandbox
data:
  config.yaml: |
    server:
      name: claude-remote
      version: "0.1.0"
    sandbox:
      workdir: /workspace
    auth:
      # issuer: https://id.example.com/application/o/claude-remote/
    children: []
