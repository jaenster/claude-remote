apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-remote
  namespace: claude-sandbox
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mcp.example.com
      secretName: claude-remote-tls
  rules:
    - host: mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claude-remote
                port:
                  name: http
